services:
  website:
    container_name: website
    image: maelstromeous/ps2alerts:website-production-latest
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    ports:
      - "80:80"
  api-aggregator:
    container_name: api-aggregator
    image: maelstromeous/ps2alerts:api-production-latest
    depends_on:
      - db
      - rabbit
      - redis
    env_file:
      - api.env
      - rabbit.env
      - redis.env
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -u \"$$RABBITMQ_USER:$$RABBITMQ_PASS\" http://rabbit:15672/api/queues/%2F/api-queue-production | grep -qE '\"consumers\":[1-9]'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    environment:
      AGGREGATOR_ENABLED: "true"
      RABBITMQ_QUEUE: api-queue-production
      DB_POOL_SIZE: 50
    networks:
      - ps2alerts
  api-cron:
    container_name: api-cron
    image: maelstromeous/ps2alerts:api-production-latest
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:3000/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      - db
      - redis
    env_file:
      - api.env
      - redis.env
    environment:
      CRON_ENABLED: "true"
    networks:
      - ps2alerts
  api-rest:
    container_name: api-rest
    image: maelstromeous/ps2alerts:api-production-latest
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:3000/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      - db
      - redis
    ports:
      - "81:3000"
    env_file:
      - api.env
      - redis.env
    environment:
      REST_ENABLED: "true"
    networks:
      - ps2alerts
  assets:
    container_name: assets
    image: maelstromeous/ps2alerts:assets-latest
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    env_file:
      - collector.env
    ports:
      - "82:80"
  collector-pc:
    container_name: collector-pc
    image: ghcr.io/nanite-systems/stream-collector:1.3.2
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      - rabbit
    env_file:
      - collector.env
    environment:
      PS2_ENVIRONMENT: ps2
    networks:
      - ps2alerts
  collector-ps4eu:
    container_name: collector-ps4eu
    image: ghcr.io/nanite-systems/stream-collector:1.3.2
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      - rabbit
    env_file:
      - collector.env
    environment:
      PS2_ENVIRONMENT: ps2ps4eu
    networks:
      - ps2alerts
  collector-ps4us:
    container_name: collector-ps4us
    image: ghcr.io/nanite-systems/stream-collector:1.3.2
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      - rabbit
    env_file:
      - collector.env
    environment:
      PS2_ENVIRONMENT: ps2ps4us
    networks:
      - ps2alerts
  aggregator-pc:
    container_name: aggregator-pc
    image: maelstromeous/ps2alerts:aggregator-production-latest
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:$${APP_PORT:-1337}/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    depends_on:
      - rabbit
      - redis
    env_file:
      - aggregator.env
      - redis.env
    ports:
      - "1337:1337"
    environment:
      CENSUS_ENVIRONMENT: ps2
    networks:
      - ps2alerts
  aggregator-ps4eu:
    container_name: aggregator-ps4eu
    image: maelstromeous/ps2alerts:aggregator-production-latest
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:$${APP_PORT:-1337}/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    depends_on:
      - rabbit
      - redis
    env_file:
      - aggregator.env
      - redis.env
    ports:
      - "1338:1338"
    environment:
      APP_PORT: 1338
      CENSUS_ENVIRONMENT: ps2ps4eu
    networks:
      - ps2alerts
  aggregator-ps4us:
    container_name: aggregator-ps4us
    image: maelstromeous/ps2alerts:aggregator-production-latest
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:$${APP_PORT:-1337}/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    depends_on:
      - rabbit
      - redis
    env_file:
      - aggregator.env
      - redis.env
    ports:
      - "1339:1339"
    environment:
      APP_PORT: 1339
      CENSUS_ENVIRONMENT: ps2ps4us
    networks:
      - ps2alerts
  db:
    container_name: db
    image: bitnamilegacy/mongodb:5.0.14-debian-11-r31
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok' | grep -q 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    env_file:
      - db.env
    ports:
      - "27017:27017"
    volumes:
      - ./volumes/db:/bitnami
    networks:
      - ps2alerts
  rabbit:
    container_name: rabbit
    image: bitnamilegacy/rabbitmq:3.10.13
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_local_alarms"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 120s
    env_file:
      - rabbit.env
    environment:
      RABBITMQ_ERL_COOKIE: "REDACTED"
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - ./volumes/rabbitmq:/bitnami
    networks:
      - ps2alerts
  redis:
    container_name: redis
    image: bitnamilegacy/redis:6.2
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    env_file:
      - redis.env
    ports:
      - "6379:6379"
    volumes:
      - ./volumes/redis:/bitnami/redis/data
    networks:
      - ps2alerts
  prometheus:
    container_name: prometheus
    image: prom/prometheus
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/-/healthy >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    ports:
      - "9090:9090"
    volumes:
      - ./files/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./volumes/prometheus:/prometheus
    networks:
      - ps2alerts
  grafana:
    container_name: grafana
    image: grafana/grafana
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    ports:
      - "9091:3000"
    volumes:
      - ./files/grafana/provisioning:/etc/grafana/provisioning
      - ./files/grafana/lib:/var/lib/grafana_docker
      - ./volumes/grafana:/var/lib/grafana
    networks:
      - ps2alerts
networks:
  ps2alerts:
    external: false
